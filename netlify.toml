# Netlify configuration for the Mystery Engine.
# Static front-end in engine/public; serverless API in engine/functions;
# shared game state in Netlify Blobs.

[build]
  base = ""
  publish = "engine/public"
  functions = "engine/functions"
  command = "cd engine && npm install && npm run build-pack && npm run validate && sh tts/build-narration.sh"

[functions]
  node_bundler = "esbuild"
  # Ship the encoded pack alongside the functions so they can decode it in memory.
  # Every plaintext file a pack carries, not just the ones that exist today:
  # theme.json and lobby.json both live here, and naming them one by one is
  # how lobby.json shipped to production missing.
  included_files = ["packs/**/*.b64", "packs/**/*.json"]

# The loaded pack's skin, served as a real stylesheet so it lands before first
# paint. Needs its own rule: the generic /api/* splat would look for a function
# literally named "theme.css".
[[redirects]]
  from = "/api/theme.css"
  to = "/.netlify/functions/theme"
  status = 200

# Friendly API path -> functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# NFC prop tags point at /prop/<id>; route to the player app which scans it.
[[redirects]]
  from = "/prop/*"
  to = "/prop.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

[[redirects]]
  from = "/host"
  to = "/host.html"
  status = 200

[[redirects]]
  from = "/invite"
  to = "/invite.html"
  status = 200

[[redirects]]
  from = "/printables"
  to = "/printables.html"
  status = 200
