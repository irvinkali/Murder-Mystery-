<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Galerie Noir — The Last Exhibit</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body class="gallery">
<div class="wrap">
  <div class="center">
    <div class="eyebrow">Galerie Noir</div>
    <h1>The Last Exhibit</h1>
    <div class="big" id="phase">—</div>
    <p class="muted" id="phaseName"></p>
    <button class="audio-btn ghost" id="audioBtn">▶ Enable sound &amp; narration</button>
    <div id="voiceRow" style="display:none;margin-top:10px">
      <label for="voiceSel" class="muted" style="display:inline;font-size:12px">Narrator voice&nbsp;</label>
      <select id="voiceSel" style="width:auto;display:inline-block;padding:6px 10px;font-size:13px"></select>
    </div>
  </div>

  <div class="card" id="revealBox" style="display:none;border-color:var(--gold)">
    <div class="narrator"><div class="eyebrow">The Reveal</div>
      <div class="beat" id="revealTitle"></div>
      <p id="revealBody" style="font-size:22px"></p>
    </div>
  </div>

  <div id="mainStage">
    <div class="card"><div class="narrator" id="narration"></div></div>
    <div class="card" id="interjectBox" style="display:none;border-color:var(--gold)">
      <div class="narrator beat" id="interjectText" style="font-size:clamp(20px,3vw,32px)"></div>
    </div>
    <div class="card" id="screenBox" style="display:none"><div class="narrator beat" id="screenText"></div></div>
    <div class="card"><h2>The guests</h2><div class="grid" id="roster"></div></div>
    <div class="card" id="resultsBox" style="display:none"><h2>The room has spoken</h2><div class="list" id="results"></div></div>
  </div>

  <footer>No accounts · No personal data beyond first names · Join with the party code on your phone</footer>
</div>
<audio id="ambient" loop></audio>
<audio id="narr"></audio>
<script src="/app.js"></script>
<script>
const party = qs('party') || Store.party;
const AUDIO = { 1:'arrivals', 2:'unveiling', 3:'investigation', 4:'keystone', 5:'accusation', 6:'reveal' };
const NARR_DIR = '/assets/narration/';
let audioReady = false, curTrack = null, docentVoice = null;
const spoken = new Set();      // keys already narrated (dedupe)
const queue = [];              // pending { text, file, major }
let speaking = false, missing = {};
let feedBaseline = null;       // don't replay interjection history on connect
let attn = { text: '', audio: null };  // the spoken call-to-attention (from state)
let audioCtx = null;           // WebAudio, created on the enable click

// A soft two-note gallery bell — generated live, no audio file needed.
function bell(done){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    [[880, 0], [659.25, 0.45]].forEach(([freq, dt]) => {   // A5 then E5
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 1.1);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + 1.2);
    });
  } catch (e) { /* no WebAudio → skip the chime */ }
  setTimeout(done, 1600);      // let the bell ring, then a breath before she speaks
}

// --- ambient ---
function setTrack(phase) {
  const name = AUDIO[phase]; if (!name || name === curTrack) return;
  curTrack = name; const a = el('#ambient'); a.src = `/assets/audio/${name}.mp3`;
  if (audioReady) a.play().catch(()=>{});
}
function duck(on){ const a = el('#ambient'); a.volume = on ? 0.15 : 1.0; }

// --- narration queue ---
function pickVoice(){
  if (!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices();
  // 1) A voice the host explicitly chose from the picker, if any.
  const saved = localStorage.getItem('narrVoice');
  if (saved){ const hit = vs.find(v=>v.name===saved); if (hit) return hit; }
  // 2) The original default selection (the first voice this game shipped with).
  return vs.find(v=>/Daniel|Arthur|George|Roger|Ryan|en-GB/i.test(v.name+v.lang))
      || vs.find(v=>/en/i.test(v.lang)) || vs[0] || null;
}
function fillVoicePicker(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  if (!vs.length) return;
  const sel = el('#voiceSel');
  const current = (docentVoice && docentVoice.name) || localStorage.getItem('narrVoice') || '';
  sel.innerHTML = vs.map(v=>`<option value="${esc(v.name)}"${v.name===current?' selected':''}>${esc(v.name.replace(/Microsoft |Online \(Natural\) - English| - English/g,'').trim())}</option>`).join('');
}
function synth(text, done){
  if (!('speechSynthesis' in window) || !text){ done(); return; }
  // One continuous utterance — the voice's own intonation carries the drama.
  // Manual chunk-pausing sounded robotic, so ellipses/dashes soften into
  // natural clause breaks instead of dead air.
  const speakText = text.replace(/\s*(\.\.\.|…)\s*/g, ', ').replace(/\s*—\s*/g, ', ')
                        .replace(/,\s*,/g, ',').trim();
  const u = new SpeechSynthesisUtterance(speakText);
  if (docentVoice) u.voice = docentVoice;
  u.rate = 0.95; u.pitch = 0.9;               // the original calm docent delivery
  let finished = false, keepalive = null;
  const finish = () => {
    if (finished) return; finished = true;
    if (keepalive) clearInterval(keepalive);
    done();
  };
  u.onend = finish; u.onerror = finish;
  // Some browsers stall long utterances after ~15s; a periodic resume() keeps
  // a full monologue flowing to the end.
  keepalive = setInterval(() => { try { speechSynthesis.resume(); } catch(e){} }, 8000);
  speechSynthesis.speak(u);
}
// Play one piece of speech: the pre-rendered file, else the browser voice.
// `settled` guards the fallback: on a missing file BOTH the element's onerror
// and the play() rejection fire — without the guard they each started their
// own reading, interleaving every sentence twice.
function playMedia(file, text, done){
  if (file && !missing[file]) {
    let settled = false;
    const n = el('#narr');
    const fail = () => { if (settled) return; settled = true; missing[file] = true; synth(text, done); };
    const finish = () => { if (settled) return; settled = true; done(); };
    n.src = NARR_DIR + file;
    n.onended = finish;
    n.onerror = fail;
    const p = n.play();
    if (p && p.catch) p.catch(fail);
  } else {
    synth(text, done);
  }
}
function playOne(item, done){
  duck(true);
  if (item.major) {
    // Important announcement: bell → "Your attention…" → the line itself.
    bell(() => playMedia(attn.audio, attn.text, () => setTimeout(() => playMedia(item.file, item.text, done), 350)));
  } else {
    playMedia(item.file, item.text, done);
  }
}
function pump(){
  if (speaking) return;
  const item = queue.shift();
  if (!item){ duck(false); return; }
  speaking = true;
  playOne(item, () => { speaking = false; if (!queue.length) duck(false); pump(); });
}
function enqueue(key, text, file, major){
  if (!audioReady || spoken.has(key)) return;
  spoken.add(key);
  queue.push({ text: text||'', file: file||null, major: !!major });
  pump();
}

el('#audioBtn').addEventListener('click', () => {
  audioReady = !audioReady;
  el('#audioBtn').textContent = audioReady ? '⏸ Sound on' : '▶ Enable sound & narration';
  if (audioReady){
    try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch(e){}
    docentVoice = pickVoice(); fillVoicePicker(); el('#voiceRow').style.display = 'block';
    if (curTrack) el('#ambient').play().catch(()=>{}); pump();
  }
  else { el('#ambient').pause(); el('#voiceRow').style.display = 'none'; if ('speechSynthesis' in window) speechSynthesis.cancel(); }
});
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { docentVoice = pickVoice(); if (audioReady) fillVoicePicker(); };
el('#voiceSel').addEventListener('change', () => {
  localStorage.setItem('narrVoice', el('#voiceSel').value);
  docentVoice = pickVoice();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  synth('Good evening. Shall I narrate for you tonight?', ()=>{});   // instant audition
});

async function refresh() {
  if (!party) { el('#phaseName').textContent = 'Add ?party=CODE to this URL'; return; }
  try {
    const { state } = await api(`state?partyCode=${party}`);
    el('#phase').textContent = state.phase;
    el('#phaseName').textContent = state.phaseName;
    setTrack(state.phase);
    if (state.attention) attn = state.attention;

    if (state.reveal) {
      el('#revealBox').style.display = 'block'; el('#mainStage').style.display = 'none';
      const title = `Variant ${state.reveal.variant} — ${state.reveal.killer}`;
      el('#revealTitle').textContent = title; el('#revealBody').textContent = state.reveal.method || '';
      const af = state.reveal.audio || [];
      enqueue('reveal.title', `Variant ${state.reveal.variant}. ${state.reveal.killer}.`, af[0], true); // bell first
      enqueue('reveal.method', state.reveal.method || '', af[1]);
      return;
    }
    el('#revealBox').style.display = 'none'; el('#mainStage').style.display = 'block';

    el('#narration').textContent = state.narration || '';
    if (state.narration) enqueue('narr:'+(state.narrationAudio||state.phase), state.narration, state.narrationAudio, true); // phase beats ring the bell

    // Live narrator interjections — speak only what happens after we connect.
    const feed = state.narratorFeed || [];
    if (feedBaseline === null) feedBaseline = feed.length ? feed[feed.length-1].id : 0;
    for (const n of feed) {
      if (n.id <= feedBaseline || spoken.has('feed:'+n.id)) continue;
      el('#interjectBox').style.display = 'block';
      el('#interjectText').textContent = n.text;
      enqueue('feed:'+n.id, n.text, n.audio, n.major);
    }

    const latest = (state.screenCards || [])[0];
    if (latest) { el('#screenBox').style.display='block'; el('#screenText').textContent = latest.text;
      // The medical verdict is already announced (with bell) via the narrator
      // feed — display its card silently. Hint cards still speak.
      if (latest.kind !== 'medical') enqueue('card:'+(latest.audio||latest.text), latest.text, latest.audio); }
    else el('#screenBox').style.display='none';

    el('#roster').innerHTML = state.roster.map(c =>
      `<div class="tile"><b>${esc(c.characterName)}</b><span class="muted">${esc(c.firstName||'')}</span></div>`).join('');

    const res = state.pollResults || [];
    el('#resultsBox').style.display = res.length ? 'block' : 'none';
    el('#results').innerHTML = res.map(r => {
      const total = Object.values(r.counts).reduce((a,b)=>a+b,0) || 1;
      const rows = Object.entries(r.counts).sort((a,b)=>b[1]-a[1]).map(([opt,n]) =>
        `<div class="barrow"><span>${esc(opt)}</span><span class="bar"><span style="width:${Math.round(100*n/total)}%"></span></span><span class="muted">${n}</span></div>`).join('');
      return `<div style="margin-bottom:14px"><div class="serif" style="font-size:18px">${esc(r.question)}</div>${rows}</div>`;
    }).join('');
  } catch (e) { el('#phaseName').textContent = e.message; }
}
refresh(); setInterval(refresh, 4000);
</script>
</body>
</html>
