<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your Dossier — The Last Exhibit</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="wrap">
  <div class="eyebrow">The Last Exhibit</div>
  <div class="row" style="align-items:baseline">
    <h1 id="charName" style="flex:3">…</h1>
    <span class="pill" id="phasePill" style="flex:0 0 auto">Phase —</span>
  </div>

  <!-- What happens now (all players) -->
  <div class="narrator note" id="narration" style="display:none"></div>

  <!-- Private in-world messages: killer unlock, branching drops, find-hints -->
  <div id="notes"></div>

  <!-- The current phase's private script line -->
  <div class="note" id="linesBox" style="display:none">
    <div class="kicker">Your lines · this moment</div>
    <div id="lineQuote"></div>
    <div class="action" id="linePrompt"></div>
  </div>

  <div class="card">
    <h2>Your dossier</h2>
    <div class="brief" id="brief">Loading…</div>
  </div>

  <div class="card" id="alibiBox" style="display:none;border-color:var(--gold)">
    <h2>Where were you at 6:40?</h2>
    <p class="muted">Everyone is being asked. Answer honestly — or don't.</p>
    <input id="alibiInput" placeholder="e.g. by the bar, in the west gallery…" />
    <button id="alibiBtn">Log my answer</button>
    <div class="err" id="alibiErr"></div>
  </div>

  <div class="card">
    <h2>I found something</h2>
    <p class="muted">Tap an exhibit's tag with your phone, or type the <b>exhibit number</b> printed on its placard.</p>
    <div class="row">
      <input id="exInput" inputmode="numeric" placeholder="Exhibit number" style="flex:2" />
      <button id="exBtn" style="flex:1;margin-top:0">Examine</button>
    </div>
    <div class="note" id="findBox" style="display:none"></div>
  </div>

  <div class="card">
    <h2>The room</h2>
    <p class="muted" id="victim"></p>
    <div class="divider"></div>
    <div class="grid" id="roster"></div>
  </div>

  <div class="card" id="pollCard" style="display:none">
    <h2>Open question</h2>
    <div id="polls"></div>
  </div>

  <div class="center"><button class="ghost" id="leave">Leave party</button></div>
  <div class="err" id="err"></div>
</div>
<script src="/app.js"></script>
<script>
if (!Store.party || !Store.code) location.href = '/';

function renderNotes(you) {
  const parts = [];
  if (you.killer) {
    parts.push(`<div class="note secret"><div class="kicker">A note, for your eyes only</div>${esc(you.killer.whatYouDid||'')}` +
      (you.killer.guidance? `<div class="action">${you.killer.guidance.map(esc).join('<br>')}</div>`:'') + `</div>`);
  }
  for (const d of (you.drops||[])) {
    const kick = d.kind === 'hint' ? 'Something catches your eye' : d.kind && d.kind.indexOf('medical')===0 ? 'Word travels' : 'A note passed to you';
    parts.push(`<div class="note"><div class="kicker">${esc(kick)}</div>${esc(d.text||'')}</div>`);
  }
  if (you.nudge) parts.push(`<div class="note"><div class="kicker">A quiet word</div>${esc(you.nudge.text)}</div>`);
  el('#notes').innerHTML = parts.join('');
}

function renderLines(you) {
  const L = you.lines;
  if (!L) { el('#linesBox').style.display = 'none'; return; }
  el('#linesBox').style.display = 'block';
  el('#lineQuote').textContent = L.reaction ? '“' + L.reaction + '”' : '“' + (L.quote||'') + '”';
  el('#linePrompt').textContent = L.prompt ? ('To do: ' + L.prompt) : '';
}

function renderPolls(list) {
  const open = list.filter(p => !p.closed);
  el('#pollCard').style.display = open.length ? 'block' : 'none';
  el('#polls').innerHTML = open.map(p => `
    <div style="margin-bottom:16px">
      <div class="serif" style="font-size:18px">${esc(p.question)}</div>
      <div class="guidance">${esc(p.guidance||'')}</div>
      <div class="row">${p.options.map(o => `<button data-poll="${esc(p.id)}" data-choice="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    </div>`).join('');
  document.querySelectorAll('[data-poll]').forEach(b => b.addEventListener('click', async () => {
    try { await api('poll', { action:'vote', partyCode: Store.party, personalCode: Store.code, id: b.dataset.poll, choice: b.dataset.choice });
      b.textContent = '✓ ' + b.dataset.choice; b.disabled = true; } catch(e){ el('#err').textContent = e.message; }
  }));
}

async function refresh() {
  try {
    const { state, you } = await api(`state?partyCode=${Store.party}&personalCode=${Store.code}`);
    el('#phasePill').textContent = `Phase ${state.phase} · ${state.phaseName}`;
    el('#victim').textContent = state.victim || '';
    if (state.narration) { el('#narration').style.display = 'block'; el('#narration').textContent = state.narration; }
    else el('#narration').style.display = 'none';
    if (you && you.character) { el('#charName').textContent = you.character.name; el('#brief').textContent = you.character.brief; }
    if (you) { renderNotes(you); renderLines(you); }
    el('#roster').innerHTML = state.roster.map(c =>
      `<div class="tile"><b>${esc(c.characterName)}</b><span class="muted">${esc(c.firstName||'')}</span></div>`).join('');
    renderPolls(state.polls || []);
    const showAlibi = you && state.phase === 3 && !you.alibiSubmitted;
    el('#alibiBox').style.display = showAlibi ? 'block' : 'none';
  } catch (e) { el('#err').textContent = e.message; }
}

async function examine(value) {
  const box = el('#findBox'); box.style.display = 'block'; box.textContent = 'Examining…';
  try {
    const { reveal } = await api('scan', { partyCode: Store.party, personalCode: Store.code, exhibit: value });
    if (reveal.unknown) { box.innerHTML = `<div class="muted">${esc(reveal.message||'Nothing matches that number.')}</div>`; return; }
    let html = `<div class="kicker">You found something</div><div class="serif" style="font-size:20px">${esc(reveal.label||'')}</div><p class="muted">${esc(reveal.blurb||'')}</p>`;
    if (reveal.locked) { box.className = 'note secret'; html += `<p>${esc(reveal.lockedHint||'Not yet.')}</p>`; }
    else { box.className = 'note'; if (reveal.extra) html += `<p>${esc(reveal.extra.text)}</p>`; else html += `<p class="muted">Nothing more reveals itself — for now.</p>`; }
    box.innerHTML = html;
  } catch (e) { box.textContent = e.message; }
}

el('#exBtn').addEventListener('click', () => { const v = el('#exInput').value.trim(); if (v) examine(v); });
el('#alibiBtn').addEventListener('click', async () => {
  const answer = el('#alibiInput').value.trim();
  if (!answer) { el('#alibiErr').textContent = 'Say something.'; return; }
  try { await api('alibi', { action:'submit', partyCode: Store.party, personalCode: Store.code, answer });
    el('#alibiBox').style.display = 'none'; refresh(); } catch (e) { el('#alibiErr').textContent = e.message; }
});
el('#leave').addEventListener('click', () => { Store.clear(); location.href = '/'; });
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
